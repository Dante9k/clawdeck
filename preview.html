<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#172326" />
    <meta name="description" content="ClawDeck · 单台服务器的 OpenClaw 统一管理面板" />
    <title>ClawDeck · 龙虾控制台</title>

    <style>:root {
  font-family: Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #253438;
  background: #f6f7f8;
  font-synthesis: none;
  font-size: 14px;
  --ink: #233438;
  --muted: #859195;
  --line: #e8ecee;
  --accent: #e77961;
  --green: #378a71;
  --sidebar: 234px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #e9a794;
  outline-offset: 3px;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  border: 0;
  background: none;
  color: inherit;
}
svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  vertical-align: middle;
}
.muted {
  color: var(--muted);
}
.mono,
code,
pre {
  font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
}
.boot {
  padding: 25vh 10vw;
  font-size: 36px;
  font-weight: 700;
}
.boot span {
  display: block;
  font-size: 14px;
  font-weight: 400;
  margin-top: 20px;
  color: var(--muted);
}
.sidebar {
  width: var(--sidebar);
  position: fixed;
  inset: 0 auto 0 0;
  background: #182529;
  color: #a8b5b8;
  display: flex;
  flex-direction: column;
  padding: 31px 18px 19px;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #fff;
  padding: 0 13px 31px;
  font-size: 23px;
  letter-spacing: -0.8px;
  font-weight: 650;
}
.brand img {
  width: 35px;
  height: 35px;
}
.brand small {
  display: block;
  color: #83969c;
  font-size: 9px;
  letter-spacing: 2.8px;
  font-weight: 500;
  margin-top: 3px;
}
.workspace {
  margin: 0 7px 31px;
  padding: 13px 10px;
  border: 1px solid #334044;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: #e5ecee;
}
.workspace .square {
  background: #2c3d42;
  border-radius: 6px;
  padding: 8px;
}
.workspace small {
  display: block;
  color: #8d9da2;
  font-size: 10px;
  margin-top: 4px;
}
.workspace .chevron {
  margin-left: auto;
  color: #7e9298;
}
.nav-caption {
  font-size: 10px;
  letter-spacing: 1.5px;
  padding: 0 17px;
  margin-bottom: 12px;
  color: #71868c;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nav button {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 13px 17px;
  border-radius: 7px;
  text-align: left;
  font-size: 13px;
}
.nav button:hover {
  background: #24353a;
}
.nav button.active {
  color: #f6a490;
  background: #35403f;
}
.nav button.active svg {
  color: #f39780;
}
.nav .count {
  margin-left: auto;
  font-size: 10px;
  background: #42514f;
  color: #ebf1ed;
  padding: 2px 6px;
  border-radius: 4px;
}
.sidebar-bottom {
  margin-top: auto;
}
.node-status {
  margin: 22px 9px 18px;
  padding: 14px 12px;
  background: #213236;
  border: 1px solid #304349;
  border-radius: 9px;
  line-height: 1.8;
  font-size: 11px;
}
.node-status strong {
  display: block;
  color: #dce6e8;
  font-weight: 500;
}
.dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 6px;
  vertical-align: 2px;
}
.node-status .dot {
  color: #6bc3a0;
}
.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 12px;
  border-top: 1px solid #304047;
  padding-top: 18px;
  font-size: 12px;
  color: #d5e0e3;
}
.avatar {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #45585e;
  color: #f7f9f9;
  font-size: 10px;
  font-weight: 600;
}
.profile small {
  display: block;
  color: #7f959c;
  font-size: 10px;
  margin-top: 3px;
}
.profile button {
  margin-left: auto;
  color: #7f959c;
}
.main {
  margin-left: var(--sidebar);
  min-height: 100vh;
}
.topbar {
  height: 73px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  font-size: 11px;
  color: #8c989d;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 12px;
}
.breadcrumb strong {
  font-weight: 500;
  color: #4d5f65;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 19px;
}
.top-actions .divider {
  width: 1px;
  height: 18px;
  background: var(--line);
}
.badge {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 10px;
  white-space: nowrap;
}
.badge.demo {
  background: #fff2e9;
  color: #b96d45;
}
.badge.good {
  background: #eaf5ef;
  color: #34896b;
}
.badge.warn {
  background: #fff4e6;
  color: #b17b31;
}
.badge.bad {
  background: #fcefeb;
  color: #ca6e59;
}
.badge.gray {
  background: #f0f2f4;
  color: #879398;
}
.content {
  max-width: 1530px;
  margin: 0 auto;
  padding: 32px 38px 26px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 26px;
  gap: 16px;
}
.eyebrow {
  font-size: 9px;
  color: #89989e;
  letter-spacing: 2.1px;
  font-weight: 600;
  margin-bottom: 7px;
}
h1 {
  font-size: 26px;
  letter-spacing: -0.5px;
  font-weight: 650;
  margin: 0 0 9px;
}
h2 {
  font-size: 16px;
  font-weight: 600;
  margin: 0;
}
h3 {
  font-size: 14px;
  margin: 0;
  font-weight: 600;
}
p {
  line-height: 1.8;
}
.page-heading p {
  font-size: 12px;
  color: #829094;
  margin: 0;
}
.actions {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
}
.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  border: 1px solid #e1e6e8;
  border-radius: 7px;
  background: white;
  padding: 9px 13px;
  font-size: 11px;
  font-weight: 500;
  min-height: 35px;
  white-space: nowrap;
}
.button:hover {
  background: #f6f8f9;
  border-color: #cbd5d9;
}
.button.primary {
  background: #e77a62;
  border-color: #e77a62;
  color: white;
  box-shadow: 0 2px 3px #e77a6218;
}
.button.primary:hover {
  background: #d76d55;
}
.button.dark {
  background: #263b40;
  border-color: #263b40;
  color: white;
}
.button.danger {
  color: #bc574c;
  border-color: #e9c7c0;
  background: #fff5f2;
}
.button.small {
  padding: 5px 9px;
  min-height: 28px;
  font-size: 10px;
}
.button svg {
  width: 14px;
  height: 14px;
}
.icon-button {
  padding: 5px;
  border-radius: 5px;
  display: inline-flex;
}
.icon-button:hover {
  background: #ecf0f2;
}
.mobile-menu {
  display: none;
}
.hero {
  background: #20353a;
  border-radius: 11px;
  min-height: 155px;
  color: #f1f6f7;
  display: grid;
  grid-template-columns: 1fr 320px;
  position: relative;
  overflow: hidden;
  margin-bottom: 21px;
  padding: 27px 31px;
}
.hero:after {
  content: '';
  position: absolute;
  inset: 0 0 0 45%;
  opacity: 0.1;
  pointer-events: none;
  background-image:
    linear-gradient(#c1d3d3 1px, transparent 1px),
    linear-gradient(90deg, #c1d3d3 1px, transparent 1px);
  background-size: 27px 27px;
  mask-image: linear-gradient(90deg, transparent, #000);
}
.hero-left,
.hero-right {
  z-index: 1;
}
.hero-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 17px;
  font-weight: 550;
  letter-spacing: 0.2px;
}
.server-icon {
  background: #344e53;
  border: 1px solid #4b6368;
  padding: 9px;
  border-radius: 8px;
  display: flex;
}
.server-icon svg {
  width: 21px;
  height: 21px;
  color: #cfdddd;
}
.hero .badge {
  background: #2e4b45;
  color: #a3d1bb;
  border: 1px solid #456357;
  font-size: 9px;
  padding: 3px 7px;
}
.server-meta {
  display: flex;
  gap: 21px;
  font-size: 10px;
  color: #92a8ad;
  margin-top: 17px;
  flex-wrap: wrap;
}
.server-meta span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.server-meta svg {
  width: 12px;
  height: 12px;
}
.hero-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 28px;
}
.hero-number {
  font-size: 31px;
  font-weight: 450;
  letter-spacing: -1px;
}
.hero-number span {
  font-size: 11px;
  color: #8fa7ac;
  letter-spacing: 0;
  margin-left: 6px;
}
.hero-caption {
  font-size: 10px;
  color: #a2b7bb;
  margin-top: 6px;
}
.hero-divider {
  width: 1px;
  height: 41px;
  background: #43585c;
}
.hero-kicker {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #7a979f;
  margin-bottom: 12px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 17px;
  margin-bottom: 28px;
}
.metric {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 17px 20px 15px;
  position: relative;
  min-height: 118px;
}
.metric-title {
  font-size: 11px;
  color: #7c8b91;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.metric-title svg {
  width: 16px;
  height: 16px;
  color: #a0afb2;
}
.metric-value {
  font-size: 29px;
  font-weight: 600;
  letter-spacing: -0.8px;
  margin: 12px 0 7px;
  line-height: 1;
}
.metric-value small {
  font-size: 12px;
  margin-left: 5px;
  font-weight: 400;
  color: #95a0a4;
  letter-spacing: 0;
}
.metric-foot {
  font-size: 10px;
  color: #96a1a5;
}
.metric-foot .green {
  color: #3d997a;
}
.mini-bars {
  position: absolute;
  right: 17px;
  bottom: 18px;
  display: flex;
  gap: 3px;
  height: 30px;
  align-items: flex-end;
}
.mini-bars i {
  width: 5px;
  border-radius: 2px 2px 0 0;
  background: #e5f0eb;
}
.mini-bars.coral i {
  background: #f9e6df;
}
.metric-line {
  height: 3px;
  background: #f1f3f4;
  margin-top: 14px;
  border-radius: 2px;
  overflow: hidden;
}
.metric-line i {
  display: block;
  height: 100%;
  background: #94b9a9;
  border-radius: 2px;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 17px;
  gap: 12px;
}
.section-heading h2 small {
  margin-left: 9px;
  font-size: 10px;
  color: #8a989d;
  font-weight: 400;
}
.text-button {
  font-size: 11px;
  color: #859296;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.text-button:hover {
  color: var(--accent);
}
.text-button svg {
  width: 13px;
  height: 13px;
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 15px;
}
.filters {
  display: flex;
  gap: 5px;
}
.filter {
  font-size: 11px;
  color: #8a979b;
  padding: 7px 11px;
  border-radius: 5px;
}
.filter.active {
  background: #e9eeed;
  color: #37584e;
  font-weight: 550;
}
.filter span {
  margin-left: 6px;
  font-size: 10px;
  color: #9aa5a8;
}
.filter.active span {
  color: #5f7e73;
}
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 8px 11px;
  border-radius: 6px;
  width: 240px;
  color: #9caaaf;
}
.search svg {
  height: 14px;
  width: 14px;
}
.search input {
  border: 0;
  outline: none;
  background: transparent;
  font-size: 11px;
  width: 100%;
  min-width: 0;
  color: #40565e;
}
.search kbd {
  font-size: 9px;
  white-space: nowrap;
  color: #a0adb1;
  border: 1px solid #e8ecee;
  padding: 1px 3px;
  border-radius: 3px;
}
.instances {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}
.instance {
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 19px 19px 0;
  transition:
    box-shadow 0.16s,
    border-color 0.16s;
  position: relative;
  min-width: 0;
}
.instance:hover {
  box-shadow: 0 5px 20px #253f4908;
  border-color: #cedbdc;
}
.instance.selected {
  border-color: #dc9f8e;
  box-shadow: 0 0 0 1px #e2ad9e;
}
.instance-head {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 14px;
}
.claw-avatar {
  width: 37px;
  height: 37px;
  flex-shrink: 0;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: #fceddf;
  color: #b7895b;
}
.claw-avatar svg {
  width: 23px;
  height: 23px;
}
.claw-avatar.a1 {
  background: #e9eff9;
  color: #7f96bf;
}
.claw-avatar.a2 {
  background: #e8f3ed;
  color: #6d9b82;
}
.claw-avatar.a3 {
  background: #f1eaf6;
  color: #a38ab2;
}
.claw-avatar.a4 {
  background: #f6eae4;
  color: #bf927e;
}
.claw-avatar.a5 {
  background: #eef0f2;
  color: #a3afb5;
}
.instance-head .name {
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  max-width: 178px;
}
.instance-head .sub {
  font-size: 9px;
  color: #9aa6ab;
  margin-top: 5px;
  letter-spacing: 0.15px;
}
.instance-head .badge {
  margin-left: auto;
  font-size: 9px;
}
.instance .desc {
  font-size: 10px;
  color: #8d9b9f;
  margin-bottom: 16px;
}
.model-line {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: #687e87;
  margin: 10px 0;
  min-width: 0;
}
.model-line svg {
  width: 12px;
  height: 12px;
  color: #93a4aa;
}
.model-line .model {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 75%;
  font-family: Consolas, monospace;
}
.channel-chip {
  background: #f4f6f7;
  border: 1px solid #e9edef;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  color: #75898f;
}
.resource-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 16px 0 17px;
}
.resource-title {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #8e9da2;
  margin-bottom: 6px;
}
.resource-title strong {
  color: #5e747c;
  font-size: 10px;
  font-weight: 450;
}
.resource-track {
  height: 3px;
  background: #eff2f3;
  border-radius: 2px;
  overflow: hidden;
}
.resource-track i {
  height: 100%;
  display: block;
  background: #a9c4b8;
}
.resource-track.memory i {
  background: #c2cbdc;
}
.instance-footer {
  border-top: 1px solid #f0f2f3;
  margin: 0 -19px;
  padding: 11px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  font-size: 9px;
  color: #9ca7ab;
}
.instance-footer span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.instance-footer svg {
  width: 12px;
  height: 12px;
}
.instance-footer .text-button {
  font-size: 10px;
  color: #72888f;
}
.instance-footer .text-button:hover {
  color: #d78169;
}
.card-select {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 12px;
  height: 12px;
  opacity: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.instance:hover .card-select,
.card-select:focus,
.card-select:checked {
  opacity: 1;
}
.bottom-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
  margin-top: 27px;
}
.panel {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 9px;
  padding: 20px;
}
.event {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 0;
  border-bottom: 1px solid #f0f2f3;
}
.event:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.event-symbol {
  width: 25px;
  height: 25px;
  border-radius: 7px;
  background: #eef5f1;
  color: #60937d;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.event-symbol svg {
  width: 12px;
  height: 12px;
}
.event-symbol.warning,
.event-symbol.error {
  background: #fcf0e8;
  color: #bf8b59;
}
.event-content {
  font-size: 10px;
  color: #677d85;
  line-height: 1.8;
}
.event-content strong {
  font-weight: 500;
  color: #425e68;
}
.event time {
  margin-left: auto;
  color: #9aa6ab;
  font-size: 9px;
  white-space: nowrap;
  margin-top: 3px;
}
.hint-panel {
  background: #edf2f0;
  border-color: #e4ebe7;
  position: relative;
  overflow: hidden;
}
.hint-panel h3 {

      }
      if (c.state !== "running") return respond({ error: "请先启动演示实例。" }, 409);
      const raw = previewDB.configs.get(id);
      if (action === "diagnostics")
        return respond({
          ok: true,
          demo: true,
          checks: ["离线演示模拟检查"],
          note: "未连接 Docker，未执行原生校验。"
        });
      if (action === "backups")
        return respond({
          backups: (previewBackups.get(id) || []).map(({ config, ...b }) => b),
          demo: true
        });
      if (options.method !== "POST")
        return respond({
          config: redact(editable(raw)),
          revision: revision(raw),
          path: "/home/user/.openclaw/openclaw.json",
          demo: true
        });
      const input = JSON.parse(options.body);
      if (input.revision !== revision(raw))
        return respond({ error: "演示配置已变化，请重新读取。" }, 409);
      const old = input.backup ? (previewBackups.get(id) || []).find((b) => b.id === input.backup) : null;
      if (input.backup && !old) return respond({ error: "备份不存在" }, 404);
      const next = applyEditable(raw, old ? editable(old.config) : input.config);
      if (action === "preview")
        return respond({ changes: configDiff(raw, next), revision: revision(raw), demo: true });
      const model = next.agents.defaults.model, primary = typeof model === "string" ? model : model.primary;
      if (primary && !/^[^\s/]+\/\S+$/.test(primary))
        return respond({ error: "模型格式应为 provider/model。" }, 422);
      if (action === "config" || action === "restore") {
        const backups = previewBackups.get(id) || [];
        backups.unshift({
          id: requestId(),
          time: (/* @__PURE__ */ new Date()).toISOString(),
          size: JSON.stringify(raw).length,
          config: structuredClone(raw)
        });
        previewBackups.set(id, backups.slice(0, 50));
        previewDB.configs.set(id, next);
        c.model = primary || "未设置";
        c.channels = Object.keys(next.channels || {});
        record(c, action, "演示配置已保存（内存）");
      }
      return respond({ ok: true, valid: true, revision: revision(next), demo: true });
    } catch (error) {
      return respond({ error: error.message }, 400);
    }
  };
}
