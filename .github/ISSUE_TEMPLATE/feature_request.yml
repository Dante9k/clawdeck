name: Feature request / 功能建议
description: Describe a concrete workflow that could be improved.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today? / 当前遇到什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives / 期望行为与替代方案
    validations:
      required: true
