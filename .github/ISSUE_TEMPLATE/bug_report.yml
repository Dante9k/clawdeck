name: Bug report / 缺陷报告
description: Report a reproducible problem without secrets or production data.
body:
  - type: markdown
    attributes:
      value: Never attach API keys, passwords, complete configurations or unsanitized logs. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment / 版本与环境
      description: ClawDeck version, Docker/Compose, CPU architecture, OpenClaw image tag/digest and config mount type. Do not include host credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏后的证据
